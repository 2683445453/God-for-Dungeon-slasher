name: Publish release

on:
  push:
    tags: ['r[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate tag and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^r[0-9]+$') { throw 'Expected an r<number> release tag.' }
          if (-not (Test-Path -LiteralPath 'CHANGELOG.md')) { throw 'CHANGELOG.md is missing.' }
      - name: Build, test and verify release archive
        shell: pwsh
        run: ./build.ps1 -SkipGameCheck -PackageName "dungeon-slasher-$env:RELEASE_TAG"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-results
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish ZIP and SHA-256 checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG `
            "dist/dungeon-slasher-$env:RELEASE_TAG.zip" `
            "dist/dungeon-slasher-$env:RELEASE_TAG.sha256" `
            --verify-tag --title "DUNGEON SLASHER $env:RELEASE_TAG" `
            --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
