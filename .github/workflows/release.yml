name: Publish release

on:
  push:
    tags: ['r[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate tag and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^r[0-9]+$') { throw 'Expected an r<number> release tag.' }
          if (-not (Test-Path -LiteralPath 'CHANGELOG.md')) { throw 'CHANGELOG.md is missing.' }
      - name: Build, test and verify release archive
        shell: pwsh
        run: ./build.ps1 -SkipGameCheck -PackageName "dungeon-slasher-$env:RELEASE_TAG"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-results
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify locally prepared assets and publish draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assetDirectory = Join-Path $PWD 'build/release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir $assetDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Prepare a draft release with the locally verified native-skin ZIP and checksum before pushing the tag.' }
          $name = "dungeon-slasher-$env:RELEASE_TAG"
          $zip = Join-Path $assetDirectory "$name.zip"
          $expected = (Get-Content -LiteralPath (Join-Path $assetDirectory "$name.sha256") -Raw).Trim()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($expected -cne "$actual  $name.zip") { throw 'Release checksum mismatch.' }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $required = @('DungeonSlasherTrainer.exe','DungeonSlasher.Runtime.dll','native-ui.bin','使用说明.txt','LICENSE.MinHook.txt','LICENSE.ImGui.txt','LICENSE.Project.txt')
            if ($archive.Entries.Count -ne $required.Count) { throw 'Unexpected release ZIP file count.' }
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName -notin $required -or $entry.Length -eq 0) { throw 'Unexpected or empty release file.' }
            }
          } finally { $archive.Dispose() }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
