name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, run native regressions and package
        shell: pwsh
        run: ./build.ps1 -SkipGameCheck -PackageName dungeon-slasher-ci
      - name: Upload test logs and panel previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-test-results
          path: |
            build/logs/
            build/tests/panel-*.bmp
          if-no-files-found: warn
          retention-days: 14
      - name: Upload source-tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-package
          path: |
            dist/dungeon-slasher-ci.zip
            dist/dungeon-slasher-ci.sha256
          if-no-files-found: error
          retention-days: 14
